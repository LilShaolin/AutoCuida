[versions]
agp = "9.2.0"
ksp = "2.3.4"
coreKtx = "1.17.0"
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
fragment = "1.8.9"
lifecycle = "2.10.0"
navigation = "2.9.6"
room = "2.8.4"
work = "2.11.2"
coroutines = "1.10.2"
mpandroidchart = "v3.1.0"
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
